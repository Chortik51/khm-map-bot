<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта Хмельницького</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  html, body, #map { height: 100%; margin:0; padding:0; }
  .delete-btn {
    background-color:#ff4d4d; border:none; color:white; padding:4px 8px;
    border-radius:6px; cursor:pointer; font-size:12px; margin-top:4px;
  }
  .delete-btn:hover { background-color:#d93636; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([49.422983,26.987133],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const markersLayer = L.layerGroup().addTo(map);

let userId = localStorage.getItem('user_id');
if(!userId){
  userId = 'user-'+Math.random().toString(36).substring(2,12);
  localStorage.setItem('user_id', userId);
}

async function loadMarkers(){
  markersLayer.clearLayers();
  const res = await fetch('/api/markers',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({user_id:userId})
  });
  const data = await res.json();
  data.forEach(m=>{
    const date = new Date(m.timestamp*1000);
    const hh = String(date.getHours()).padStart(2,'0');
    const mm = String(date.getMinutes()).padStart(2,'0');
    const time = `${hh}:${mm}`;
    const color = m.is_owner ? 'green' : 'red';
    const marker = L.circleMarker([m.lat,m.lon],{color,radius:10,fillOpacity:0.8}).addTo(markersLayer);
    let popupHtml = `<b>🕒 ${time}</b>`;
    if(m.is_owner){
      popupHtml += `<br><button class="delete-btn" onclick="deleteMarker(${m.id})">Видалити</button>`;
    }
    marker.bindPopup(popupHtml);
  });
}

map.on('click', async (e)=>{
  const {lat,lng} = e.latlng;
  await fetch('/api/add_marker',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({lat,lon:lng,user_id:userId})
  });
  loadMarkers();
});

async function deleteMarker(id){
  if(!confirm("Видалити цю метку?")) return;
  try{
    const res = await fetch('/api/delete_marker',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({id:id,user_id:userId})
    });
    const result = await res.json();
    if(result.status==="deleted"){ loadMarkers(); }
    else if(result.status==="not_owner"){ alert("❌ Ви можете видаляти лише свої метки."); }
    else{ alert("⚠️ Помилка при видаленні"); }
  }catch(e){ alert("Помилка мережі"); console.error(e);}
}

loadMarkers();
setInterval(loadMarkers,10000);
</script>
</body>
</html>
